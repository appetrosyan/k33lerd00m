// Ray-traced shadow variants: reuse the shadow-atlas Texture2D binding at t5 as a
// screen-space visibility mask (USE_RT_SHADOW), so no new binding layout is needed.
// Point + spot only (parallel/sun stays on the shadow-map path); normals fixed RGBA.
builtin/lighting/interactionSM.vs.hlsl -T vs -D USE_GPU_SKINNING={0,1} -D LIGHT_POINT={0,1} -D LIGHT_PARALLEL=0 -D USE_PBR={0,1} -D USE_NORMAL_FMT_RGB8=0 -D USE_SHADOW_ATLAS=1 -D USE_RT_SHADOW=1 -D USE_PUSH_CONSTANTS={0,1}
